name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: "Release version (for example, 1.3.1)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    # forkでは実行しない。forkはupstreamのtagを同期するだけで独自のversionを切らない（docs/release.md）
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          release-as: ${{ inputs.release_as }}
